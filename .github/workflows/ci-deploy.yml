name: CI e deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validar projeto
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Instalar dependencias
        run: yarn install --frozen-lockfile
      - name: Verificar tipos
        run: yarn audit:types
      - name: Verificar SQL
        run: yarn security:check
      - name: Gerar build Next.js
        run: yarn build

  image:
    name: Publicar imagem
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.image.outputs.name }}
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Definir nome da imagem
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Entrar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Construir e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy na VPS
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Validar configuracao SSH
        shell: bash
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          for value in VPS_HOST VPS_USER VPS_DEPLOY_PATH VPS_PASSWORD VPS_KNOWN_HOSTS; do
            test -n "${!value}" || { echo "Secret obrigatorio ausente: $value"; exit 1; }
          done
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "VPS_HOST invalido"; exit 1; }
          [[ "$VPS_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || { echo "VPS_USER invalido"; exit 1; }
          [[ "${VPS_PORT:-22}" =~ ^[0-9]+$ ]] || { echo "VPS_PORT invalida"; exit 1; }
          [[ "$VPS_DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "VPS_DEPLOY_PATH deve ser um caminho absoluto simples"; exit 1; }
      - name: Configurar cliente e host SSH
        shell: bash
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sshpass
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          known_host="$VPS_HOST"
          if [[ "${VPS_PORT:-22}" != "22" ]]; then
            known_host="[$VPS_HOST]:$VPS_PORT"
          fi
          ssh-keygen -F "$known_host" -f ~/.ssh/known_hosts >/dev/null || {
            echo "VPS_KNOWN_HOSTS nao contem uma entrada para $known_host"
            echo "Salve a linha completa gerada por ssh-keyscan, nao apenas o fingerprint."
            exit 1
          }
      - name: Enviar Compose e executar deploy
        shell: bash
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
          IMAGE_NAME: ${{ needs.image.outputs.name }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          port="${VPS_PORT:-22}"
          target="${VPS_USER}@${VPS_HOST}"
          ssh_args=(-p "$port" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes)
          sshpass -e ssh "${ssh_args[@]}" "$target" mkdir -p "$VPS_DEPLOY_PATH"
          sshpass -e scp -P "$port" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o StrictHostKeyChecking=yes \
            docker-compose.yml "$target:$VPS_DEPLOY_PATH/docker-compose.yml"
          printf '%s' "$GHCR_TOKEN" | sshpass -e ssh "${ssh_args[@]}" "$target" \
            docker login ghcr.io -u "$GHCR_USER" --password-stdin
          sshpass -e ssh "${ssh_args[@]}" "$target" bash -s -- "$VPS_DEPLOY_PATH" "$IMAGE_NAME:$IMAGE_TAG" <<'REMOTE'
          set -Eeuo pipefail
          cd "$1"
          export APP_IMAGE="$2"
          test -f .env || { echo "Arquivo $1/.env ausente na VPS"; exit 1; }
          docker compose pull app migrate
          docker compose up -d --no-build --remove-orphans --wait --wait-timeout 180
          docker compose ps
          REMOTE
