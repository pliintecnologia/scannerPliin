x-app-image: &app-image
  image: ${APP_IMAGE:-scannerpliin-app}
  build:
    context: .

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scanner_pliin}
      POSTGRES_USER: ${POSTGRES_USER:-scanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scanner} -d ${POSTGRES_DB:-scanner_pliin}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  app:
    <<: *app-image
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://scanner_app:${APP_DATABASE_PASSWORD}@db:5432/${POSTGRES_DB:-scanner_pliin}
      AUTH_SECRET: ${AUTH_SECRET:?Defina AUTH_SECRET no arquivo .env}
      APP_URL: ${APP_URL:-}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      ASAAS_ENVIRONMENT: ${ASAAS_ENVIRONMENT:-sandbox}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
      ASAAS_BASE_URL: ${ASAAS_BASE_URL:-}
      BILLING_COMPANY_NAME: ${BILLING_COMPANY_NAME:-Scanner Pliin}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    ports:
      - "${APP_PORT:-3001}:3000"
    shm_size: "1gb"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks: [backend]

  migrate:
    <<: *app-image
    command: ["yarn", "db:migrate"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-scanner}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-scanner_pliin}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Defina APP_DATABASE_PASSWORD no arquivo .env}
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
